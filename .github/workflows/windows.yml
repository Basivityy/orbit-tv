name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Orbit TV $v (build ${{ github.run_number }})"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter --version

      - name: Dependencies
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/1-pub-get.txt
          flutter pub deps --style=compact > ci-logs/1-pub-deps.txt 2>&1 || true

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-logs/2-analyze.txt

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ci-logs/3-test.txt

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} 2>&1 | tee ci-logs/4-build.txt

      - name: Bundle VC++ runtime (app-local, so it runs on clean PCs)
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $out -Force; Write-Host "bundled $dll" }
          }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\OrbitTV-$env:APP_VERSION-portable.zip" -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\orbit_tv.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitTV-Windows-${{ env.APP_VERSION }}-b${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Build logs go to the "ci-logs" branch (readable with git, also when a step failed).
      - name: Publish logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > ci-logs/0-summary.txt
          cd ci-logs
          git init -q
          git config user.name "orbit-ci"
          git config user.email "orbit-ci@users.noreply.github.com"
          git checkout -q -b ci-logs
          git add -A
          git commit -q -m "CI logs run ${{ github.run_number }} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: GitHub release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
