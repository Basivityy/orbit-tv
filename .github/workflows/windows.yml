name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Flutter 3.27 knows Visual Studio 2019/2022 (windows-2022 image).
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Orbit Player $v (build ${{ github.run_number }})"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter --version

      - name: Dependencies
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/1-pub-get.txt
          flutter pub deps --style=compact > ci-logs/1-pub-deps.txt 2>&1 || true

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-logs/2-analyze.txt

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ci-logs/3-test.txt

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} 2>&1 | tee ci-logs/4-build.txt

      # End-to-end check: fake Xtream server + the real app driven by keyboard/mouse;
      # screenshots and logs end up on the ci-logs branch. Never blocks the release build.
      - name: E2E - test media
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          New-Item -ItemType Directory -Force ci-media | Out-Null
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=25" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 300 -c:v libx264 -preset veryfast -b:v 1500k -g 50 -pix_fmt yuv420p -c:a aac -b:a 96k -f mpegts ci-media\test_progressive.ts
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=720x576:rate=50" -f lavfi -i "sine=frequency=660:sample_rate=48000" -t 300 -vf "tinterlace=mode=interleave_top,setfield=tff" -c:v libx264 -preset veryfast -b:v 1200k -flags +ilme+ildct -x264-params "interlaced=1:tff=1" -g 50 -pix_fmt yuv420p -c:a aac -b:a 96k -f mpegts ci-media\test_interlaced.ts
          Copy-Item installer\app_icon.png ci-media\logo.png
          # EPG programme pictures served by the fake panel (xmltv.php / JSON EPG).
          ffmpeg -hide_banner -loglevel error -f lavfi -i "mandelbrot=size=960x540" -frames:v 1 -y ci-media\epg1.png
          ffmpeg -hide_banner -loglevel error -f lavfi -i "smptehdbars=size=960x540" -frames:v 1 -y ci-media\epg2.png
          ffmpeg -hide_banner -loglevel error -f lavfi -i "cellauto=size=960x540:rule=110:random_fill_ratio=0.5" -frames:v 1 -y ci-media\epg3.png
          ffmpeg -hide_banner -loglevel error -f lavfi -i "life=size=960x540:mold=10:ratio=0.3:life_color=#FFD400:death_color=#202020" -frames:v 1 -y ci-media\epg4.png
          Get-ChildItem ci-media | Format-Table Name, Length

      - name: E2E - run the app
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          $srv = Start-Process python -ArgumentList "tool\ci\fake_xtream.py","ci-media","8899" -PassThru -RedirectStandardError ci-logs\fake-server.txt -RedirectStandardOutput ci-logs\fake-server-out.txt
          Start-Sleep -Seconds 2
          & .\tool\ci\e2e.ps1
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          $log = Join-Path $env:APPDATA "Orbitex FZE LLC\Orbit Player\orbit_player.log"
          if (Test-Path $log) { Copy-Item $log ci-logs\app-log.txt }

      - name: Bundle VC++ runtime (app-local, so it runs on clean PCs)
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $out -Force; Write-Host "bundled $dll" }
          }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\OrbitPlayer-$env:APP_VERSION-portable.zip" -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\orbit_tv.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitPlayer-Windows-${{ env.APP_VERSION }}-b${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Build logs go to the "ci-logs" branch (readable with git, also when a step failed).
      - name: Publish logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > ci-logs/0-summary.txt
          cd ci-logs
          git init -q
          git config user.name "orbit-ci"
          git config user.email "orbit-ci@users.noreply.github.com"
          git checkout -q -b ci-logs
          git add -A
          git commit -q -m "CI logs run ${{ github.run_number }} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      # Release: a pushed tag v*, or a push to main whose commit message contains [release]
      # (creates/updates the release v<pubspec version> with the installer and the portable zip).
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          target_commitish: ${{ github.sha }}
          name: Orbit Player ${{ env.APP_VERSION }} (Windows)
          files: dist/*
          make_latest: true
          body: |
            **Orbit Player ${{ env.APP_VERSION }} za Windows**

            - `OrbitPlayer-Setup-${{ env.APP_VERSION }}.exe` — instalacija (preporučeno)
            - `OrbitPlayer-${{ env.APP_VERSION }}-portable.zip` — bez instalacije: raspakuj i pokreni `OrbitPlayer.exe`

            Windows 10/11, 64-bit.
