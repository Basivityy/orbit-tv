name: QuicklyTools CI

on:
  push:
    paths: ["quicklytools/**", ".github/workflows/quicklytools-ci.yml"]
  pull_request:
    paths: ["quicklytools/**", ".github/workflows/quicklytools-ci.yml"]

defaults:
  run:
    working-directory: quicklytools

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: quicklytools, POSTGRES_PASSWORD: ci-password, POSTGRES_DB: quicklytools }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U quicklytools" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://quicklytools:ci-password@localhost:5432/quicklytools
      SITE_URL: http://localhost:3000
      INTERNAL_API_SECRET: ci-internal-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: quicklytools/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start production server
        run: |
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 nohup node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
      - name: Create e2e admin users
        run: |
          ADMIN_EMAIL=e2e-owner@example.com ADMIN_PASSWORD='E2e-Owner-Password-1!' npm run admin:create -- --yes
          ADMIN_EMAIL=e2e-editor@example.com ADMIN_PASSWORD='E2e-Editor-Password-1!' ADMIN_ROLE=EDITOR npm run admin:create -- --yes
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E (Chromium, Firefox, WebKit, mobile)
        run: npx playwright test --project=chromium --project=firefox --project=webkit --project=mobile-chrome --project=mobile-safari
        env: { BASE_URL: "http://localhost:3000" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "quicklytools/playwright-report" }
