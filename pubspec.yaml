name: orbit_tv
description: Orbit Player — IPTV player (live TV, TV guide, catch-up, movies & series) for Xtream Codes compatible services.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Player: libmpv on Windows (all codecs, MPEG-TS, HLS, hardware decoding).
  # media_kit_video 1.3.1 fixes a Windows race when the video size changes (zapping SD <-> HD).
  media_kit: ^1.2.1
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  http: ^1.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  xml: ^6.5.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Archivo — same typeface as the OrbitModul panel (SIL Open Font License).
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Archivo-Black.ttf
          weight: 900
