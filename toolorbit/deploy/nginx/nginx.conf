user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time cache=$upstream_cache_status';
  access_log /var/log/nginx/access.log main buffer=64k flush=5s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;

  # Real client IP when behind Cloudflare (only trusted from Cloudflare ranges).
  include /etc/nginx/snippets/cloudflare-realip.conf;

  # Rate limiting (per client IP). The app adds finer per-endpoint limits.
  limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=admin:10m rate=3r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Micro-cache for public HTML: absorbs traffic spikes without stale admin edits.
  proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:50m max_size=1g inactive=10m use_temp_path=off;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m max_size=2g inactive=30d use_temp_path=off;

  # Never serve cached pages to signed-in admins.
  map $http_cookie $skip_cache {
    default 0;
    ~*(__Host-to_admin|to_admin)= 1;
  }

  upstream app {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  include /etc/nginx/conf.d/*.conf;
}
