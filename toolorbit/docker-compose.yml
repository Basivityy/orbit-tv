# ToolOrbit production stack: nginx (TLS, caching, rate limits) → Next.js app → PostgreSQL.
# Usage: see docs/DEPLOYMENT.md. Secrets come from .env (never commit it).
name: toolorbit

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=${DB_POOL_SIZE:-10}
  SITE_URL: ${SITE_URL}
  SITE_NAME: ${SITE_NAME:-ToolOrbit}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
  TRUST_PROXY: "true"
  CF_API_TOKEN: ${CF_API_TOKEN:-}
  CF_ZONE_ID: ${CF_ZONE_ID:-}
  ROBOTS_DISALLOW_ALL: ${ROBOTS_DISALLOW_ALL:-false}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    shm_size: 256mb
    # Not published to the host: only the app can reach the database.

  migrate:
    image: toolorbit-tools:${APP_TAG:-latest}
    build: { context: ., target: tools }
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }
    networks: [backend]
    profiles: ["tools"]
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    image: toolorbit-app:${APP_TAG:-latest}
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_IPV6_TEST_URL: ${NEXT_PUBLIC_IPV6_TEST_URL:-}
        APP_VERSION: ${APP_TAG:-latest}
    restart: unless-stopped
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }
    networks: [backend, frontend]
    # ISR output is written inside .next at runtime, so the filesystem stays writable;
    # privileges are still dropped and the process runs as the unprivileged "node" user.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          memory: "${APP_MEMORY_LIMIT:-1g}"
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
      - nginxcache:/var/cache/nginx
    environment:
      SERVER_NAME: ${SERVER_NAME}
      SSL_CERT: ${SSL_CERT:-/etc/nginx/certs/fullchain.pem}
      SSL_KEY: ${SSL_KEY:-/etc/nginx/certs/privkey.pem}
    networks: [frontend]
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./deploy/certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  pgdata:
  nginxcache:
  certbot-www:

networks:
  backend:
    internal: true
  frontend:
